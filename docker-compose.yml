services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_appointment_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: mysql:8.0
    container_name: clinic_db
    environment:
      MYSQL_DATABASE: clinic
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: clinic
      MYSQL_PASSWORD: clinic
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: clinic_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  mysql_data: